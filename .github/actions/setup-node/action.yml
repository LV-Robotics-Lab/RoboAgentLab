name: Set up Node
description: Node 24 with the npm cache, the native libraries the TUI tests need, and `npm ci` without lifecycle scripts.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: npm
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
        sudo ln -sf "$(which fdfind)" /usr/local/bin/fd
    - shell: bash
      run: npm ci --ignore-scripts --no-audit --no-fund
