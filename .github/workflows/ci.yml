name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: python3 -m pip install --user -q uv==0.12.17 # setup.sh's dry runs need uv
      - name: Load pinned model catalog
        run: node scripts/hydrate-ci-models.mjs
      - run: npm run build:offline
      - run: npm run check
      - name: Agent queue compatibility
        working-directory: packages/agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/agent.test.ts
      - name: Extension and session export compatibility
        working-directory: packages/coding-agent
        run: node ../../node_modules/vitest/dist/cli.js --run test/trigger-compact-extension.test.ts test/export-jsonl-share.test.ts
      - name: embodied tests
        working-directory: packages/embodied
        run: node --test --experimental-strip-types test/*.test.ts

  services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --user -q uv==0.12.17
      # As root, like a deployed env server: run_code isolates programs under their own uid, which needs root.
      - run: sudo env "PATH=$PATH" services/test.sh
