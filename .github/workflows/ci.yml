name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 7 * * 1" # weekly dependency audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      # Regenerates the model catalog from the providers' live listings, so a new model type shows up here first.
      - run: npm run build
      - run: npm run check
      - run: npm run build:daemon --workspace packages/env
      - run: npm test
      - name: embodied tests
        working-directory: packages/embodied
        run: node --test --experimental-strip-types test/*.test.ts
      - name: MCP client conformance
        run: npm run test:mcp-conformance

  services:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m pip install --user -q uv==0.12.17
      # As root, like a deployed env server: run_code isolates programs under their own uid, which needs root.
      - run: sudo env "PATH=$PATH" services/test.sh

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node
      - run: node scripts/npm-audit.mjs
      - run: npm audit signatures --omit=dev
